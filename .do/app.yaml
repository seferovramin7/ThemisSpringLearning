name: themis-spring-app
region: fra
services:
  - name: themis-spring-service
    github:
      branch: main
      deploy_on_push: true
      repo: seferovramin7/ThemisSpringLearning # Replace with your GitHub repo
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    source_dir: /
    routes:
      - path: /
    health_check:
      http_path: /actuator/health
    envs:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        value: "jdbc:h2:mem:testdb"
      - key: SPRING_DATASOURCE_USERNAME  
        value: "sa"
      - key: SPRING_DATASOURCE_PASSWORD
        value: ""
      - key: SPRING_H2_CONSOLE_ENABLED
        value: "true" 